services:
  workoutreader:
    build: .
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-3000}
      DATA_DIR: /data
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-4131}:${APP_PORT:-3000}"
    volumes:
      - ./data:/data
